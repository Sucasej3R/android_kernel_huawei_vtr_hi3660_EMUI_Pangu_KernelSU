name: Kernel Panic report | 反馈内核崩溃
description: Report Kernel Panic | 报告内核崩溃问题
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting the issue to Pangu Kernel!
        To help us better assist you, please provide the following information.
        To avoid duplicate reports, please be sure to use English in the title.
        If it's about kernel issues with EMUI 9.1, please don't make new issue here.

        感谢给 Pangu内核 汇报问题！
        为了使我们更好地帮助你，请提供以下信息。
        为了防止重复汇报，标题请务必使用英文。
        如果是关于 EMUI9.1 的内核问题，请不要在这里新建议题。
        

  - type: checkboxes
    attributes:
       label: Please check before submitting an issue | 在提交 Issue 前请检查
       options:
          - label: I searched the issues and didn't found anything relevant | 我已经搜索了 Issues 列表，没有发现于本问题相关内容
            required: true

          - label: I will upload the dmesg-ramoops-0 (if available) and console-ramoops-0 files (obtained under third-party Recovery, path: sys/fs/pstore) | 我会上传 dmesg-ramoops-0（如果有） 和 console-ramoops-0 文件（在第三方Recovery下获取，路径：sys/fs/pstore）
            required: true
            
          - label: I have confirmed that the issue is not caused by modifications like magisk or similar issues | 我已经确认不是由于magisk等相关修改导致的问题
            required: true

          - label: These are problems caused by non-system applications | 是由于非系统应用导致的问题
            required: false

          - label: I know how to reproduce the issue, which might not be specific to my device | 我知道如何重新复现这个问题
            required: false

          - label: GSI images are used | 使用的是GSI镜像
            required: false


  - type: checkboxes
    id: latest
    attributes:
      label: Version requirements | 版本要求
      options:
        - label: I'm using the latest CI version of kernel | 我正在使用最新 CI 版本
          required: false
      
        - label: I'm using the latest Release version of kernel | 我正在使用最新 Release 版本
          required: false

  - type: textarea
    attributes:
        label: Bug description | 描述 Bug
        description: |
          Please enter a clear and concise description of the bug.  
          对 Bug 的清晰简洁的描述。
    validations:
        required: true

  - type: textarea
    attributes:
        label: Reproduce method | 复现方法
        description: |
          Steps to reproduce the bug.  
          复现的步骤。
        placeholder: |
          - 1. Go to...
          - 2. Click on...
          - 3. Scroll down to...
          - 4. See error
    validations:
      required: true

  - type: textarea
    attributes:
        label: Expected behavior | 预期行为
        description: |
          Please enter a clear and concise description of what you expected to happen.  
          对你期望发生的行为进行清晰简洁的描述。
    validations:
      required: true

  - type: textarea
    attributes:
        label: Actual behavior | 实际行为
        description: |
          Tell us what actually happened.  
          告诉我们实际发生了什么。
    validations:
      required: true

  - type: textarea
    attributes:
        label: Screenshots | 截图
        description: |
          If possible, add screenshots to help explain your issue.  
          如果可以的话，添加截图可以帮你解释问题。

  - type: textarea
    attributes:
        label: Logs (dmesg-ramoops-0/console-ramoops-0)| 日志 (dmesg-ramoops-0/console-ramoops-0)
        description: |
          If possible, add the log to help us find your issue.  
          如果可以的话，添加日志可以帮助我们找到问题。

  - type: input
    attributes:
      label: Device name | 设备名称
      description: |
        e.g., HUAWEI Mate 9
        例如 HUAWEI Mate 9
    validations:
      required: true

  - type: input
    attributes:
      label: OS version | 系统版本
      description: |
        If you are using GSI, please also provide the ROM name and OS version
        如果正在使用GSI也请提供ROM名称和系统版本
    validations:
      required: true

  - type: input
    attributes:
      label: Kernel version | 内核版本
      description: |
        Obtain it using uname -a under the shell
        在 shell 下使用 uname -a 获取
    validations:
      required: true

  - type: textarea
    attributes:
        label: Other information | 其他信息
        description: |
          Add any information about the issue.  
          添加关于问题的任何信息。
        placeholder: |
          Upload by clicking the bottom bar. Uploading logs to other websites or using external links isn't allowed  
          点击文本框底栏上传，禁止上传到其它网站或使用外链提供日志
    validations:
      required: false
